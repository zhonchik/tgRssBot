name: Build
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - run: go mod download all
      - run: go mod verify
      - run: go test -mod=readonly ./...
      - run: go vet -mod=readonly ./...
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -mod=readonly -trimpath -o dist/tgRssBot .
      - uses: actions/upload-artifact@v4
        with:
          name: tgRssBot-linux-amd64
          path: dist/tgRssBot
